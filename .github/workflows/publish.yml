name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified distribution to PyPI
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build and test dependencies
        run: python -m pip install build twine '.[test]'
      - name: Run backend tests
        run: python -m unittest discover -s solradviewer/backend/tests
      - name: Build web interface and Python distributions
        run: ./scripts/build-release.sh
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/check-installed.py
          cd "${RUNNER_TEMP}"
          solradviewer --help
          python -c "from importlib.resources import files; assert (files('solradviewer') / 'web' / 'index.html').is_file()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/solradviewer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
