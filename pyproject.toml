[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solradviewer"
version = "0.1.0"
description = "Interactive solar radio imaging, dynamic spectra, and context-image analysis."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "astropy>=6.0,<7",
  "fastapi>=0.115,<1",
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pillow>=10,<12",
  "pydantic>=2,<3",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<1",
  "sunpy[map]>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
]

[project.scripts]
solradviewer = "solradviewer.cli:main"

[project.urls]
Homepage = "https://github.com/sageyu123/solradviewer"
Repository = "https://github.com/sageyu123/solradviewer"
Issues = "https://github.com/sageyu123/solradviewer/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
solradviewer = ["web/**/*"]

[tool.setuptools.packages.find]
include = ["solradviewer*"]
exclude = ["solradviewer.backend.tests*", "solradviewer.web*"]
